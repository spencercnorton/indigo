# Every push to main or beta and every pull request: build the DOL and the SD
# card zip and check both, build again in a fresh container to prove the build
# is reproducible, boot the build in Dolphin from a disc and from an SD card
# made from its zip, walk its menus with a controller and launch a game and an
# app all the way to a program that reports what the hand-off left it
# (buildtools/ui/emulator/), run the host tests (plain, GCC and
# Clang sanitizers, contracts) and the source checks. Every job runs on our own machines, in a
# fresh container that takes one job and is then thrown away
# (buildtools/ci/runner/README.md). The zip is kept as an artifact, so any
# pull request can be tried on a console before it merges.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
  # Weekly on main: the same checks on the release, which catches a change in
  # the runners themselves, and a longer fuzzing run.
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The image every DOL is built in. The build runner is built on it, and
  # buildtools/ci/check_workflows.py keeps this line and its Dockerfile equal.
  TOOLCHAIN: ghcr.io/extremscorner/libogc2@sha256:e6531ecaa458d0b5d8c9ba57cee1facc5fb9120808c6d9eebb2c05e4ffaf6f0f

jobs:
  build:
    name: Build
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Toolchain
        run: buildtools/ci/toolchain.sh "$TOOLCHAIN"
      - name: Build Indigo
        run: make dev
      - name: Check the DOL
        run: |
          mkdir -p dist
          python3 buildtools/ci/verify_dol.py cube/swiss/swiss.dol --toolchain "$TOOLCHAIN" \
            --revision "$(git rev-parse HEAD)" --short "$(git rev-parse HEAD | cut -c1-7)" \
            --out dist/provenance.json
          cp cube/swiss/swiss.dol dist/swiss.dol
          git show-ref --tags > dist/tags.txt || true  # the DOL lists every tag (tags.h)
      - name: Package and check the SD card zip
        run: |
          version="ci-$(git rev-parse --short=8 HEAD)"
          buildtools/sd_package.sh "$version" cube/swiss/swiss.dol dist
          python3 buildtools/ci/check_package.py "dist/Indigo-$version.zip" \
            --dol cube/swiss/swiss.dol --version "$version"
          {
            echo "### Build"
            echo "| | bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
            for file in dist/swiss.dol "dist/Indigo-$version.zip"; do
              echo "| \`${file#dist/}\` | $(wc -c < "$file") | \`$(sha256sum "$file" | cut -c1-64)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the emulator test's programs
        run: |
          make -C buildtools/ui/emulator/probe
          cp buildtools/ui/emulator/probe/probe.dol dist/probe.dol
          make -C buildtools/ui/emulator/aesnd
          cp buildtools/ui/emulator/aesnd/aesnd.dol dist/aesnd.dol
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indigo-sd-card-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dol-${{ github.sha }}
          path: |
            dist/swiss.dol
            dist/probe.dol
            dist/aesnd.dol
            dist/provenance.json
            dist/tags.txt
          if-no-files-found: error
          retention-days: 14

  reproducible:
    name: Reproducible build
    needs: build
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Toolchain
        run: buildtools/ci/toolchain.sh "$TOOLCHAIN"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dol-${{ github.sha }}
          path: first
      - name: The tags the first build saw
        # The DOL lists every tag, so a tag pushed between the two builds would
        # make them differ. Tags never move (they are immutable), so dropping the
        # ones the first build did not have leaves exactly its set.
        run: |
          cut -d' ' -f2 first/tags.txt > first/tag-refs.txt
          git tag -l | while read -r tag; do
            grep -qxF "refs/tags/$tag" first/tag-refs.txt || git tag -d "$tag" > /dev/null
          done
      - name: Build Indigo again, in a fresh container and another locale
        # The toolchain image's own locale, which a build that follows the
        # README gets; this image's is C.UTF-8. The bytes must not care.
        run: LC_ALL=en_US.UTF-8 make dev
      - name: Both builds are the same bytes
        run: |
          sha256sum first/swiss.dol cube/swiss/swiss.dol
          if ! cmp first/swiss.dol cube/swiss/swiss.dol; then
            echo "::error::Two builds of the same commit in the same toolchain differ. Something in the build depends on the machine, the time or the order of files."
            exit 1
          fi
          echo "Reproducible: two independent builds are byte for byte the same." >> "$GITHUB_STEP_SUMMARY"
      - name: The performance build
        # Frame times and the GPU's counters drawn over the menus
        # (UI_PERF=1), to measure a change on a console. It runs here, beside
        # the Emulator job, so it adds nothing to the time CI takes.
        run: make -C cube/swiss -j8 BUILD=build-perf TARGET=swiss-perf UI_PERF=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dol-perf-${{ github.sha }}
          path: cube/swiss/swiss-perf.dol
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: ${{ matrix.name }}
    needs: build
    runs-on: [self-hosted, indigo-emulator]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke: every menu, then the probe launched as an app. game: the
          # Library to a game's launch, the probe launched as a game. The
          # console's region and cable decide the video mode: PAL composite
          # 576i, NTSC composite 480i, a component cable 480p. dvd boots with
          # the demonstration disc in the drive; sd2sp2 from an SD card made
          # from this build's zip, as someone sets one up; gcloader from such a
          # card in a GC Loader, which serves the game from its fragments.
          - { name: Emulator, route: smoke, region: pal, cable: composite, storage: dvd, artifact: emulator }
          # It also stops AESND hundreds of times, as a launch does (aesnd_test.py).
          - { name: "Emulator (game, PAL, component)", route: game, region: pal, cable: component,
              storage: dvd, aesnd: true, artifact: emulator-game-pal-component }
          # The GC Loader smoke job's card starts with settings/non-default.ini;
          # the game jobs' cards are new, so they start in Settings.
          - { name: "Emulator (smoke, NTSC, component, GC Loader)", route: smoke, region: ntsc,
              cable: component, storage: gcloader, settings: non-default,
              artifact: emulator-smoke-ntsc-component-gcloader }
          - { name: "Emulator (game, NTSC, SD2SP2)", route: game, region: ntsc, cable: composite,
              storage: sd2sp2, artifact: emulator-game-ntsc-sd2sp2 }
          # A save on a card whose writes fail after 13, then the same card
          # booted again: the settings must still load, in their colours.
          - { name: "Emulator (save, NTSC, SD2SP2, failing card)", route: save, region: ntsc,
              cable: composite, storage: sd2sp2, settings: non-default, sd_faults: write-error-after=13,
              artifact: emulator-save-ntsc-sd2sp2-faults }
          # Its game is in 40 pieces on the card, the most a GC Loader serves.
          - { name: "Emulator (game, NTSC, component, GC Loader)", route: game, region: ntsc,
              cable: component, storage: gcloader, fragments: 40,
              artifact: emulator-game-ntsc-component-gcloader }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dol-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.storage != 'dvd'
        with:
          name: indigo-sd-card-${{ github.sha }}
          path: card
      - name: Boot the build in Dolphin, walk its menus and launch the probe
        env:
          ROUTE: ${{ matrix.route }}
          REGION: ${{ matrix.region }}
          CABLE: ${{ matrix.cable }}
          STORAGE: ${{ matrix.storage }}
          SETTINGS: ${{ matrix.settings }}
          FRAGMENTS: ${{ matrix.fragments }}
          SD_FAULTS: ${{ matrix.sd_faults }}
        run: |
          set -- --probe build/probe.dol --route "$ROUTE" --region "$REGION" --cable "$CABLE"
          if [ "$STORAGE" != dvd ]; then
            set -- "$@" --storage "$STORAGE" --card-zip card/Indigo-*.zip
          fi
          if [ -n "$SETTINGS" ]; then
            set -- "$@" --settings "$SETTINGS"
          fi
          if [ -n "$FRAGMENTS" ]; then
            set -- "$@" --fragments "$FRAGMENTS"
          fi
          if [ -n "$SD_FAULTS" ]; then
            set -- "$@" --sd-faults "$SD_FAULTS"
          fi
          python3 buildtools/ui/emulator/run.py build/swiss.dol "$@" --out emulator
      - name: Stop AESND hundreds of times, as a launch does
        if: matrix.aesnd
        run: python3 buildtools/ui/emulator/aesnd_test.py build/aesnd.dol --out emulator/aesnd
      - name: Summary
        if: always()
        run: cat emulator/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: emulator/
          if-no-files-found: warn
          retention-days: 14

  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: plain, lane: plain, cc: gcc }
          - { name: sanitized, lane: sanitized, cc: gcc }
          - { name: "sanitized, Clang", lane: sanitized, cc: clang }
          - { name: contracts, lane: contracts, cc: gcc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run the ${{ matrix.name }} lane
        env:
          CC: ${{ matrix.cc }}
          LANE: ${{ matrix.lane }}
          UI_TEST_JOBS: "8"
          UI_TEST_REQUIRE_GXTEXCONV: "1"
        run: buildtools/ui/tests/run_tests.sh "$LANE"

  fuzz:
    # Not in "CI passed": a fuzzer can find an old bug on any pull request, so
    # a red Fuzz is a real parser bug to fix, not a verdict on this change.
    name: Fuzz
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fuzz the files Indigo reads from a card
        env:
          SECONDS_EACH: ${{ github.event_name == 'schedule' && '600' || '30' }}
        run: buildtools/ui/tests/fuzz/run_fuzz.sh "$SECONDS_EACH" fuzz-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: |
            fuzz-out/crashes/
            fuzz-out/*.log
          retention-days: 30

  target:
    name: Target branch
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 2
    steps:
      - name: Changes go to beta; main takes only beta or a hotfix
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          [ "$BASE_REF" != main ] && exit 0
          if [ "$SAME_REPO" = true ]; then
            case "$HEAD_REF" in beta|hotfix/*) exit 0 ;; esac
          fi
          echo "Pull requests go to beta. main takes only beta (a release) or a hotfix/* branch; see docs/RELEASING.md." >&2
          exit 1

  source:
    name: Source checks
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Whitespace and line endings
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="HEAD^"; fi
          buildtools/check_whitespace.sh "$base"
      - name: Upstream (outside the interface, the Swiss commit UPSTREAM names, or listed there)
        run: python3 buildtools/ci/check_upstream.py
      - name: AESND (libogc2's, byte for byte, at the toolchain's commit; Indigo's changes as patches)
        run: python3 buildtools/ci/check_aesnd.py
      - name: Scripts, CI tools and workflows
        run: buildtools/ci/source_checks.sh

  passed:
    name: CI passed
    if: always()
    needs: [build, reproducible, emulator, host-tests, target, source]
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
