# Every push to main or beta and every pull request: build the DOL and the SD card
# zip in the pinned devkitPPC/libogc2 image, run the host test suite, and check
# whitespace. The zip is kept as an artifact, so any pull request can be tried on
# a console before it merges.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/extremscorner/libogc2@sha256:84dcb9aa7c9ee716d4953a3985a9551996cdb7a24c2d95e32153ad0da83da575
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build Indigo
        run: make dev
      - name: Package the SD card zip
        run: |
          version="ci-$(git rev-parse --short=8 HEAD)"
          mkdir -p dist
          buildtools/sd_package.sh "$version" cube/swiss/swiss.dol dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indigo-sd-card-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  host-tests:
    name: Host tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/extremscorner/libogc2@sha256:84dcb9aa7c9ee716d4953a3985a9551996cdb7a24c2d95e32153ad0da83da575
    strategy:
      fail-fast: false
      matrix:
        lane: [plain, sanitized, contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the host toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-pil python3-numpy zlib1g-dev
      - name: Run the ${{ matrix.lane }} lane
        env:
          LANE: ${{ matrix.lane }}
          UI_TEST_REQUIRE_GXTEXCONV: "1"
        run: buildtools/ui/tests/run_tests.sh "$LANE"

  target:
    name: Target branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Changes go to beta; main takes only beta or a hotfix
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          [ "$BASE_REF" != main ] && exit 0
          if [ "$SAME_REPO" = true ]; then
            case "$HEAD_REF" in beta|hotfix/*) exit 0 ;; esac
          fi
          echo "Pull requests go to beta. main takes only beta (a release) or a hotfix/* branch; see docs/RELEASING.md." >&2
          exit 1

  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Whitespace and line endings
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="HEAD^"; fi
          buildtools/check_whitespace.sh "$base"
      - name: UI isolation (a pull request changes the interface, not the loader)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: buildtools/check_ui_isolation.sh "origin/$BASE_REF"
