name: Bug report
description: Something in Indigo does not behave as documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove anything private from logs and output before pasting them: file paths that contain personal names and any serial numbers visible in a photograph.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Boot Indigo on the console
        2. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Home and navigation", "Source picker", "Library and posters", "Game details", "Cheats", "Launch screen", "Memory Cards", "Music and sounds", "Settings", "Device handlers", "Booting a game", "Other / not sure"]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "The Indigo release you downloaded (or the commit under System › System Information › About Indigo), the console model, and how you boot it."
      placeholder: "Indigo v2.1.0, NTSC-U DOL-001, PicoBoot + SD2SP2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: "What was on screen, and the last thing you did before it happened. Scrubbed."
      render: text
