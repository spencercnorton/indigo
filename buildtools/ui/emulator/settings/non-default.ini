# Indigo's own settings, each away from its default, for the emulator test
# (run.py --settings non-default). The route must still find every face, and
# the card must still hold every line after Indigo's own saves. Menu
# Widescreen is left out: its narrower face names defeat the route's way of
# telling them apart.
Menu Color=Jet Black
Backdrop Color=Emerald
Wave Color=Gold
Library Icon=Books
Source Icon=Disc
Settings Icon=Gear
System Icon=Chip
Clock=Left
Disable Menu Music=Yes
Disable Menu SFX=Yes
Reduce UI Animations=Yes
IGRType=Apploader
Hide Saves on Details=Yes
